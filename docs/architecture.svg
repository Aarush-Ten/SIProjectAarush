<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc">
<title id="title">PathForge AI working prototype architecture</title><desc id="desc">Next.js sends validated snapshots to stateless FastAPI matching and roadmap services. SQLite stores catalogs and administrator-managed experts, while browser storage keeps the guest profile and progress. Optional Gemini wording is validated separately; three practice quizzes are graded server-side.</desc>
