name: Application and security checks

on:
  push:
  pull_request:
  schedule:
    - cron: '17 4 * * 1' # weekly Monday, UTC

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install isolated locked security tools
        run: |
          python -m venv .tools/security-venv
          .tools/security-venv/bin/python -m pip install -r scripts/security-requirements.txt
      - name: Scan dependencies, source, secrets and reachable history
        run: npm run security:scan
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements.txt
          npm --prefix frontend ci
          cd frontend
          npx playwright install --with-deps chromium
      - name: Verify generated API interfaces
        run: |
          backend/.venv/bin/python scripts/export_openapi.py --check
          npm run types:api
          git diff --exit-code -- frontend/lib/types/generated-api.ts
      - name: Unit, API, build and browser checks
        run: npm run check:e2e
      - name: Submission package security regressions
        run: npm run submission:test
      - name: Retain browser failure report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
