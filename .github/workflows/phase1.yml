name: Phase 1 and 2 checks

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements.txt
          npm --prefix frontend ci
          cd frontend
          npx playwright install --with-deps chromium
      - name: Verify generated API interfaces
        run: |
          backend/.venv/bin/python scripts/export_openapi.py --check
          npm run types:api
          git diff --exit-code -- frontend/lib/types/generated-api.ts
      - name: Unit, API, build and browser checks
        run: npm run check:e2e
      - name: Retain browser failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
