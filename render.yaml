services:
  - type: web
    name: pathforge-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: DATABASE_URL
        value: sqlite:///./pathforge.db
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        sync: false
